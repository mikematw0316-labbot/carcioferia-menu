<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>La Carcioferia · Menu</title>
<meta name="description" content="La Carcioferia Troiani 菜單(英文原文 + 中文翻譯)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f7f1e3; --ink:#3a2e1c; --soft:#7a6a4f; --gold:#a9802f; --line:#d8c9a6; --en:#5c4e38;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#efe6d2; color:var(--ink);
    font-family:"Noto Serif TC","Cormorant Garamond",Georgia,serif; line-height:1.5;
    -webkit-font-smoothing:antialiased; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .sheet{max-width:760px; margin:0 auto; background:var(--paper);
    border:2px solid var(--gold); outline:1px solid var(--line); outline-offset:3px;
    padding:2rem 1.4rem 3rem; box-shadow:0 10px 40px -20px rgba(80,60,20,.5)}
  @media(min-width:640px){ .sheet{margin:1.2rem auto; padding:2.6rem 2.4rem} }

  header.top{text-align:center; border-bottom:1px double var(--gold); padding-bottom:1.1rem; margin-bottom:1.6rem}
  .brand{font-family:"Cormorant Garamond",Georgia,serif; font-weight:600; font-size:clamp(2.2rem,8vw,3.2rem);
    letter-spacing:.06em; color:var(--ink); line-height:1}
  .brand .emblem{display:block; font-size:1.6rem; margin:.3rem 0}
  .script{font-family:"Cormorant Garamond",serif; font-style:italic; font-size:1.3rem; color:var(--gold)}
  .top .note{font-size:.8rem; color:var(--soft); margin-top:.7rem; font-family:"Noto Serif TC",serif}

  section{margin-top:2rem}
  .sec-h{text-align:center; font-family:"Cormorant Garamond",serif; font-weight:600; letter-spacing:.08em;
    font-size:1.5rem; color:var(--ink); text-transform:uppercase}
  .sec-h .zh{display:block; font-family:"Noto Serif TC",serif; font-size:.95rem; color:var(--gold); letter-spacing:.05em; margin-top:.15rem}
  .sec-h::after{content:"❧"; display:block; color:var(--gold); font-size:1rem; margin:.3rem 0 1rem}

  .item{padding:.6rem 0; border-bottom:1px dotted var(--line)}
  .item:last-child{border-bottom:0}
  .item .row{display:flex; align-items:baseline; gap:.5rem}
  .item .it{flex:1; font-weight:600; font-size:1.02rem; color:var(--ink)}
  .item .al{font-size:.72rem; color:var(--soft); white-space:nowrap}
  .item .dots{flex:1; border-bottom:1px dotted var(--line); transform:translateY(-.25rem); min-width:1rem}
  .item .price{font-family:"Cormorant Garamond",serif; font-weight:600; font-size:1.05rem; color:var(--gold); white-space:nowrap}
  .item .ln{font-size:.88rem; margin-top:.18rem; display:flex; gap:.45rem}
  .item .lang{flex:0 0 auto; font-size:.6rem; font-weight:700; color:var(--gold); letter-spacing:.06em; width:1.5rem; text-align:right; padding-top:.15rem}
  .item .en{font-family:"Cormorant Garamond",Georgia,serif; font-style:italic; color:var(--en)}
  .item .zh{font-family:"Noto Serif TC",serif; color:var(--en)}

  .quote{background:rgba(169,128,47,.08); border:1px solid var(--line); border-radius:4px;
    padding:1rem 1.1rem; margin:1.6rem 0; font-family:"Cormorant Garamond",serif; font-style:italic;
    color:var(--en); font-size:1.02rem; line-height:1.6}
  .quote .zh{display:block; font-family:"Noto Serif TC",serif; font-style:normal; font-size:.85rem; color:var(--soft); margin-top:.5rem}

  .legend{margin-top:2rem; border-top:1px double var(--gold); padding-top:1.1rem}
  .legend h3{text-align:center; font-family:"Cormorant Garamond",serif; letter-spacing:.08em; font-size:1.15rem; margin-bottom:.2rem}
  .legend h3 .zh{display:block; font-family:"Noto Serif TC",serif; font-size:.82rem; color:var(--gold)}
  .legend .grid{display:grid; grid-template-columns:1fr 1fr; gap:.2rem 1.2rem; margin-top:.9rem; font-size:.82rem; color:var(--en)}
  @media(max-width:460px){ .legend .grid{grid-template-columns:1fr} }
  .legend .g{display:flex; gap:.4rem} .legend .g b{color:var(--gold); min-width:1.3rem}

  .notice{margin-top:1.6rem; text-align:center; font-size:.82rem; color:var(--soft); line-height:1.7}
  .foot{text-align:center; margin-top:2rem; padding-top:1.1rem; border-top:1px double var(--gold);
    font-family:"Cormorant Garamond",serif; letter-spacing:.14em; font-size:1.25rem; color:var(--ink)}
  .foot .zh{display:block; font-family:"Noto Serif TC",serif; font-size:.78rem; color:var(--soft); letter-spacing:.05em; margin-top:.4rem}
  .disc{text-align:center; font-size:.72rem; color:var(--soft); margin-top:1.2rem; font-family:"Noto Serif TC",serif}
</style>
</head>

const LEGEND=[["1","Cereals containing gluten · 含麩質穀物"],["2","Crustaceans · 甲殼類"],["3","Eggs · 蛋"],["4","Fish · 魚"],["5","Peanuts · 花生"],["6","Soybeans · 大豆"],["7","Milk (incl. lactose) · 奶(含乳糖)"],["8","Nuts · 堅果"],["9","Celery · 芹菜"],["10","Mustard · 芥末"],["11","Sesame seeds · 芝麻"],["12","Sulfur dioxide & sulfites · 二氧化硫與亞硫酸鹽"],["13","Lupin · 羽扇豆"],["14","Molluscs · 軟體動物"]];

function secHTML(s){
  if(s.quote) return `<div class="quote">${s.quote}<span class="zh">${s.qzh}</span></div>`;
  return `<section>
    <div class="sec-h">${s.it}<span class="zh">${s.en} · ${s.zh}</span></div>
    ${s.items.map(x=>`<div class="item">
      <div class="row"><span class="it">${x.it}</span>${x.al?`<span class="al">(${x.al})</span>`:""}<span class="dots"></span><span class="price">${x.p}</span></div>

      <div class="ln"><span class="lang">中</span><span class="zh">${x.zh}</span></div></div>`).join("")}
  </section>`;
}
